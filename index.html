<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta importante</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 800px;
            padding: 25px;
        }

        h1 {
            font-size: clamp(28px, 6vw, 55px);
            color: #49291c;
            margin-bottom: 35px;
        }

        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 16px 35px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.25s, opacity 0.25s;
        }

        #si {
            background: #42c76b;
            color: white;
        }

        #no {
            background: #ff4d4d;
            color: white;
        }

        #mensaje {
            display: none;
            font-size: clamp(35px, 10vw, 100px);
            font-weight: bold;
            color: #d62828;
            overflow-wrap: anywhere;
            animation: aparecer 0.5s ease;
        }

        #reiniciar {
            display: none;
            margin: 25px auto 0;
            background: #49291c;
            color: white;
            font-size: 18px;
        }

        @keyframes aparecer {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">
        <h1 id="pregunta">¿Soy el mejor papá del mundo?</h1>

        <div class="botones" id="botones">
            <button id="si" onclick="responderSi()">Sí</button>
            <button id="no" onclick="responderNo()">No</button>
        </div>

        <div id="mensaje"></div>

        <button id="reiniciar" onclick="location.reload()">
            Volver a empezar
        </button>
    </main>

    <script>
        const mensajes = [
            "¡Pero soy tu papá!",
            "¡Que le des que sí, hijo de la ñonga!",
            "¿Tanto te cuesta querer a tu padre?",
            "¡DESGRACIADO, DI QUE SÍ!",
            "¿ASÍ ME PAGAS TODO LO QUE HE HECHO POR TI?",
            "¡HIJO, NO ME HAGAS ESTO!",
            "Última oportunidad, criatura del demonio...",
            "¡TE VOY A DESHEREDAR!",
            "¿¡QUÉ CLASE DE HIJO CRIÉ!?",
            "Bueno... ya me quedó claro cuánto me quieres. 😭"
        ];

        let contador = 0;
        let tamaño = 1;

        const botonNo = document.getElementById("no");
        const botonSi = document.getElementById("si");
        const pregunta = document.getElementById("pregunta");
        const botones = document.getElementById("botones");
        const mensaje = document.getElementById("mensaje");
        const reiniciar = document.getElementById("reiniciar");

        function responderSi() {
            pregunta.style.display = "none";
            botones.style.display = "none";

            mensaje.textContent = "¡TE QUIERO, MIJO! ❤️";
            mensaje.style.display = "block";

            reiniciar.style.display = "block";
        }

        function responderNo() {
            if (contador < mensajes.length) {
                pregunta.textContent = mensajes[contador];
            } else {
                pregunta.textContent =
                    "¡YA NO SÉ QUÉ MÁS DECIRTE, HIJO! 😭";
            }

            contador++;

            // El botón se reduce en cada clic.
            tamaño *= 0.72;

            botonNo.style.transform = `scale(${tamaño})`;

            // También reduce su espacio y su tamaño real.
            botonNo.style.fontSize =
                Math.max(0, 24 * tamaño) + "px";

            botonNo.style.padding =
                `${16 * tamaño}px ${35 * tamaño}px`;

            if (tamaño < 0.12) {
                botonNo.style.display = "none";
                pregunta.textContent =
                    "¡EL BOTÓN DESAPARECIÓ! ¡AHORA SOLO PUEDES DECIR QUE SÍ! 😂";
            }
        }
    </script>

</body>
</html>
